spring.application.name=pkvaultmultuserapi
server.port=8084

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── EMAIL ───────────────────────────────────────────────────────────────
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

npm.api.base-url=${NPM_BASE_URL}
npm.api.identity=${NPM_API_IDENTITY}
npm.api.secret=${NPM_API_SECRET}
npm.certificate-id=${NPM_CERTIFICATE_ID:10}
npm.domain-suffix=${NPM_DOMAIN_SUFFIX}

app.url=${APP_URL:http://localhost:8084}

api.security.token.secret=${TOKEN_SECRET:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}

docker.image.pkvault=${DOCKER_IMAGE_PKVAULT:ghcr.io/chnapy/pkvault:latest}